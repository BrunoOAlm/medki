<header>
<div class="nav-wrap">
<a class="brand" href="{% url 'dashboard' %}">
<span class="brand-name">medki</span><span class="brand-caption">RemédioEmCasa-Alerta</span>
</a>
{% if user.is_authenticated %}<nav aria-label="Principal">
<a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}aria-current="page"{% endif %}>Notificações</a>
<a href="{% url 'patients' %}" {% if request.resolver_match.url_name == 'patients' %}aria-current="page"{% endif %}>Pacientes</a>{% if user.role == 'pharmacy' %}<a href="{% url 'report' %}" {% if request.resolver_match.url_name == 'report' %}aria-current="page"{% endif %}>Indicadores</a>{% endif %}{% if user.responsible %}<a href="{% url 'accounts' %}" {% if request.resolver_match.url_name == 'accounts' %}aria-current="page"{% endif %}>Contas</a>
<a href="{% url 'unit_settings' %}" {% if request.resolver_match.url_name == 'unit_settings' %}aria-current="page"{% endif %}>Prazos</a>{% endif %}</nav>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="subtle" type="submit">Sair</button>
</form>{% endif %}</div>
</header>
